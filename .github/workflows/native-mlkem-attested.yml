name: native-mlkem-attested

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  windows-x64-arm64:
    name: Windows x64 and ARM64 official binary evidence
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Install pinned Rust toolchain and Windows targets
        shell: pwsh
        run: |
          rustup toolchain install 1.89.0-x86_64-pc-windows-msvc --profile minimal
          rustup target add x86_64-pc-windows-msvc --toolchain 1.89.0-x86_64-pc-windows-msvc
          rustup target add aarch64-pc-windows-msvc --toolchain 1.89.0-x86_64-pc-windows-msvc

      - name: Verify clean source checkout
        shell: pwsh
        run: |
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) {
            throw "Official native build requires a clean checkout: $($status -join ', ')"
          }

      - name: Build reproducible Deep ML-KEM x64 and ARM64 runtimes
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'deep-native-official\mlkem'
          ./eng/Build-DeepMlKem.ps1 `
            -BuildTarget @('windows-x64', 'windows-arm64') `
            -OutputRoot $output `
            -WindowsArm64AcceptancePath 'native/Deep.MlKem/evidence/official-windows-3481ce7/windows-arm64-physical-acceptance.v1.json'

      - name: Build reproducible Deep Braid x64 and ARM64 runtimes
        shell: pwsh
        run: |
          $passA = Join-Path $env:RUNNER_TEMP 'deep-native-official\braid-pass-a'
          $passB = Join-Path $env:RUNNER_TEMP 'deep-native-official\braid-pass-b'
          foreach ($pass in @($passA, $passB)) {
            foreach ($target in @('windows-x64', 'windows-arm64')) {
              & pwsh -NoLogo -NoProfile -File ./eng/Build-DeepMlKemBraid.ps1 `
                -Target $target -OutputRoot $pass
              if ($LASTEXITCODE -ne 0) {
                throw "Deep Braid $target build failed in isolated producer process."
              }
            }
          }
          $targetMap = @{
            'windows-x64' = 'x86_64-pc-windows-msvc'
            'windows-arm64' = 'aarch64-pc-windows-msvc'
          }
          foreach ($target in $targetMap.Keys) {
            foreach ($name in @('deep_mlkem_braid.dll', 'deep_mlkem_braid.dll.lib')) {
              $relative = Join-Path "$($targetMap[$target])\release" $name
              $a = Join-Path $passA $relative
              $b = Join-Path $passB $relative
              if ((Get-Item -LiteralPath $a).Length -ne (Get-Item -LiteralPath $b).Length -or
                  (Get-FileHash -LiteralPath $a -Algorithm SHA256).Hash -cne
                  (Get-FileHash -LiteralPath $b -Algorithm SHA256).Hash) {
                throw "Deep Braid $target $name is not reproducible across clean output roots."
              }
            }
          }

      - name: Verify approved x64 Braid managed runtime boundary
        shell: pwsh
        run: |
          $braid = Join-Path $env:RUNNER_TEMP 'deep-native-official\braid-pass-a\x86_64-pc-windows-msvc\release\deep_mlkem_braid.dll'
          $mlkem = Join-Path $env:RUNNER_TEMP 'deep-native-official\mlkem\windows-x64\deep_mlkem.dll'
          $env:DEEP_MLKEM_BRAID_TEST_ASSET = $braid
          $env:DEEP_MLKEM_TEST_ASSET = $mlkem
          dotnet test tests/Deep.Protocol.Tests/Deep.Protocol.Tests.csproj `
            --configuration Release --arch x64 -m:1 `
            --filter 'FullyQualifiedName~ManagedMlKemBraidStateMachineTests'
          if ($LASTEXITCODE -ne 0) { throw 'The x64 managed Braid state-machine probe failed.' }
          dotnet build eng/Deep.MlKemBraid.RuntimeWrapperProbe/Deep.MlKemBraid.RuntimeWrapperProbe.csproj `
            --configuration Release -m:1
          if ($LASTEXITCODE -ne 0) { throw 'The x64 Braid wrapper probe build failed.' }
          $probe = 'eng/Deep.MlKemBraid.RuntimeWrapperProbe/bin/Release/net10.0/Deep.MlKemBraid.RuntimeWrapperProbe.dll'
          dotnet $probe `
            tests/Deep.Protocol.Tests/bin/Release/net10.0/win-x64/Deep.Protocol.Tests.dll `
            $mlkem $braid
          if ($LASTEXITCODE -ne 0) { throw 'The x64 Braid wrapper probe failed.' }

      - name: Assemble closed official bundle
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'deep-native-official'
          $bundle = Join-Path $outputRoot 'bundle'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $outputRoot 'mlkem\build-manifest.v1.json') -Destination $bundle
          foreach ($target in @('windows-x64', 'windows-arm64')) {
            $mlkemTarget = Join-Path $bundle "mlkem\$target"
            New-Item -ItemType Directory -Path $mlkemTarget -Force | Out-Null
            Copy-Item -LiteralPath (Join-Path $outputRoot "mlkem\$target\deep_mlkem.dll") -Destination $mlkemTarget
            Copy-Item -LiteralPath (Join-Path $outputRoot "mlkem\$target\deep_mlkem.lib") -Destination $mlkemTarget
          }
          $braidMap = @{
            'windows-x64' = 'x86_64-pc-windows-msvc'
            'windows-arm64' = 'aarch64-pc-windows-msvc'
          }
          foreach ($target in $braidMap.Keys) {
            $braidTarget = Join-Path $bundle "braid\$target"
            New-Item -ItemType Directory -Path $braidTarget -Force | Out-Null
            $release = Join-Path $outputRoot "braid-pass-a\$($braidMap[$target])\release"
            $approved = Join-Path $PWD "src\Deep.Protocol\runtimes\$($target.Replace('windows-', 'win-'))\native\deep_mlkem_braid.dll"
            if ((Get-Item -LiteralPath $approved).Length -ne (Get-Item -LiteralPath (Join-Path $release 'deep_mlkem_braid.dll')).Length -or
                (Get-FileHash -LiteralPath $approved -Algorithm SHA256).Hash -cne
                (Get-FileHash -LiteralPath (Join-Path $release 'deep_mlkem_braid.dll') -Algorithm SHA256).Hash) {
              throw "The reproduced Deep Braid $target runtime differs from the approved packaged asset."
            }
            Copy-Item -LiteralPath (Join-Path $release 'deep_mlkem_braid.dll') -Destination $braidTarget
            Copy-Item -LiteralPath (Join-Path $release 'deep_mlkem_braid.dll.lib') -Destination $braidTarget
          }
          git rev-parse HEAD | Set-Content -LiteralPath (Join-Path $bundle 'source-commit.txt') -Encoding ascii
          Get-ChildItem -LiteralPath $bundle -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($bundle, $_.FullName).Replace('\', '/')
              "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $relative
            } | Set-Content -LiteralPath (Join-Path $bundle 'SHA256SUMS') -Encoding ascii

      - name: Attest official binaries and manifest
        id: attest
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}\deep-native-official\bundle\**

      - name: Record GitHub attestation availability
        shell: pwsh
        run: |
          [pscustomobject]@{
            schema = 'deep/native-github-attestation-status/v1'
            outcome = '${{ steps.attest.outcome }}'
            repositoryVisibility = '${{ github.event.repository.visibility }}'
            sourceCommit = '${{ github.sha }}'
            note = if ('${{ steps.attest.outcome }}' -eq 'success') {
              'GitHub build provenance attestation was persisted.'
            } else {
              'GitHub build provenance attestation was unavailable; SHA256SUMS and the completed official workflow remain mandatory evidence.'
            }
          } | ConvertTo-Json -Depth 3 | Set-Content `
            -LiteralPath (Join-Path $env:RUNNER_TEMP 'deep-native-official\bundle\github-attestation-status.v1.json') `
            -Encoding utf8NoBOM

      - name: Upload official binary bundle
        uses: actions/upload-artifact@v4
        with:
          name: deep-native-windows-${{ github.sha }}
          path: ${{ runner.temp }}\deep-native-official\bundle
          if-no-files-found: error
          retention-days: 30
