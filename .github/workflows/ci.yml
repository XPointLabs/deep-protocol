name: build-test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Restore
        run: dotnet restore Deep.Protocol.slnx

      - name: Build
        run: dotnet build Deep.Protocol.slnx --configuration Release --no-restore

      - name: Offline reference corpus gate
        shell: pwsh
        run: ./eng/Test-LegacyReferenceCorpus.ps1

      - name: Exact-three actual assembly/resource/public API graph
        shell: pwsh
        run: ./eng/Test-ProductionProtocolGraph.ps1 -Configuration Release

      - name: DNP1 exact314 package evidence completeness (intentional RED until 219/219)
        shell: pwsh
        run: |
          $mappings = @(
            'artifacts/dnp1-vector-fragments/authority-recovery.json',
            'artifacts/dnp1-vector-fragments/drm3-recovery.json',
            'artifacts/dnp1-vector-fragments/identity.json',
            'artifacts/dnp1-vector-fragments/recovery-exact193.json',
            'artifacts/dnp1-vector-fragments/wire.json',
            'artifacts/dnp1-vector-fragments/drm19-replay.json',
            'artifacts/dnp1-vector-fragments/drm19-recovery-container.json',
            'artifacts/dnp1-vector-fragments/devops-package.json',
            'artifacts/dnp1-vector-fragments/genesis-full-dag.json'
          )
          ./eng/Test-Dnp1EvidenceOwnership.ps1 `
            -MappingPaths $mappings `
            -RequirePackageComplete

      - name: DNP1 executable package vectors
        if: ${{ hashFiles('tests/Deep.Protocol.GoldenVectors/Vectors/dnp1-classical-v1.executable.json') != '' }}
        shell: pwsh
        run: ./eng/Test-Dnp1ExecutableVectors.ps1 -NoBuild

      - name: Test
        run: >
          dotnet test Deep.Protocol.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/test-results/**/*.xml
          if-no-files-found: ignore

      - name: Upload vector diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vector-diffs
          path: artifacts/vector-diffs
          if-no-files-found: ignore
