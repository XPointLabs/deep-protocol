name: Native ML-DSA candidate checks

on:
  workflow_dispatch:
  push:
    branches:
      - 'release-candidate/**'
    paths:
      - 'native/Deep.MlDsa/**'
      - 'eng/Test-DeepMlDsaVendor.ps1'
      - 'eng/Test-DeepIdV2Transcript.py'
      - 'registry/deep-id-v2.vectors.json'
      - 'registry/deep-protocol-v1.registry*'
      - 'src/Deep.Protocol/ApplicationCore/DeepIdV2*'
      - 'src/Deep.Protocol/ApplicationCore/DeepMlDsa65*'
      - 'src/Deep.Protocol/Identity/DeepIdV2Root.cs'
      - 'src/Deep.Protocol/Identity/DeepRecoveryV1.cs'
      - 'src/Deep.Protocol/runtimes/**/deep_mldsa.dll'
      - 'src/Deep.Protocol/runtimes/**/libdeep_mldsa.so'
      - 'tests/Deep.Protocol.Tests/ApplicationCore/**'
      - 'tests/Deep.Protocol.Tests/Identity/DeepPqRootRecoveryV2Tests.cs'
      - 'tests/Deep.Protocol.Tests/Identity/Dnp1IdentityAuthoringV1Tests.cs'
      - '.github/workflows/native-mldsa-candidate.yml'
  pull_request:
    paths:
      - 'native/Deep.MlDsa/**'
      - 'eng/Test-DeepMlDsaVendor.ps1'
      - 'eng/Test-DeepIdV2Transcript.py'
      - 'registry/deep-id-v2.vectors.json'
      - 'registry/deep-protocol-v1.registry*'
      - 'src/Deep.Protocol/ApplicationCore/DeepIdV2*'
      - 'src/Deep.Protocol/ApplicationCore/DeepMlDsa65*'
      - 'src/Deep.Protocol/Identity/DeepIdV2Root.cs'
      - 'src/Deep.Protocol/Identity/DeepRecoveryV1.cs'
      - 'src/Deep.Protocol/runtimes/**/deep_mldsa.dll'
      - 'src/Deep.Protocol/runtimes/**/libdeep_mldsa.so'
      - 'tests/Deep.Protocol.Tests/ApplicationCore/**'
      - 'tests/Deep.Protocol.Tests/Identity/DeepPqRootRecoveryV2Tests.cs'
      - 'tests/Deep.Protocol.Tests/Identity/Dnp1IdentityAuthoringV1Tests.cs'
      - '.github/workflows/native-mldsa-candidate.yml'

permissions:
  contents: read

jobs:
  native-tests:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2022
          - windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned upstream source snapshot
        shell: pwsh
        run: ./eng/Test-DeepMlDsaVendor.ps1
      - name: Configure portable ML-DSA-65
        shell: pwsh
        run: cmake -S native/Deep.MlDsa -B '${{ runner.temp }}/deep-mldsa-build' -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: cmake --build '${{ runner.temp }}/deep-mldsa-build' --config Release --parallel 2
      - name: Native ABI tests
        shell: pwsh
        run: ctest --test-dir '${{ runner.temp }}/deep-mldsa-build' -C Release --output-on-failure
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test pinned DID2/DAB2 transcript with independent Ed25519 and native ML-DSA
        shell: pwsh
        run: |
          python -m pip install PyNaCl==1.6.2
          $probeName = if ($IsWindows) { 'deep_id_v2_vector_probe.exe' } else { 'deep_id_v2_vector_probe' }
          $candidateDir = if ($IsWindows) { '${{ runner.temp }}/deep-mldsa-build/Release' } else { '${{ runner.temp }}/deep-mldsa-build' }
          $probe = Join-Path $candidateDir $probeName
          python eng/Test-DeepIdV2Transcript.py --probe $probe
      - name: Pinned NIST ACVP vectors through Deep ABI
        shell: pwsh
        run: |
          $libraryName = if ($IsWindows) { 'deep_mldsa.dll' } else { 'libdeep_mldsa.so' }
          $candidateDir = if ($IsWindows) { '${{ runner.temp }}/deep-mldsa-build/Release' } else { '${{ runner.temp }}/deep-mldsa-build' }
          python eng/Test-DeepMlDsaAcvp.py --library (Join-Path $candidateDir $libraryName)
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.301'
      - name: Managed exact-asset DID2/DAB2 genesis, restore and signature closure
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          dotnet test tests/Deep.Protocol.Tests/Deep.Protocol.Tests.csproj
          -c Release
          --filter 'FullyQualifiedName~DeepIdV2Root_RestoreRecreatesExactCredentialAndCompactText|FullyQualifiedName~DeepIdV2Genesis_UsesSamePhraseForAccountAndPqRoot_AndRestoresExactDid2|FullyQualifiedName~Dab2_RealNativeHybridSignaturesCloseOverExactDidAndAccount|FullyQualifiedName~DeepMlDsa65NativeProviderTests'
      - name: AddressSanitizer and UBSan native ABI tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S native/Deep.MlDsa -B "$RUNNER_TEMP/deep-mldsa-sanitized" \
            -DCMAKE_BUILD_TYPE=Debug \
            '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
          cmake --build "$RUNNER_TEMP/deep-mldsa-sanitized" --parallel 2
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir "$RUNNER_TEMP/deep-mldsa-sanitized" --output-on-failure
      - name: Select candidate library and record its digest
        id: asset
        shell: pwsh
        run: |
          $libraryName = if ($IsWindows) { 'deep_mldsa.dll' } else { 'libdeep_mldsa.so' }
          $candidateDir = if ($IsWindows) { '${{ runner.temp }}/deep-mldsa-build/Release' } else { '${{ runner.temp }}/deep-mldsa-build' }
          $library = Join-Path $candidateDir $libraryName
          if (-not (Test-Path -LiteralPath $library -PathType Leaf)) { throw 'Candidate native library is missing.' }
          $digest = (Get-FileHash -LiteralPath $library -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "candidate sha256=$digest"
          "path=$library" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: deep-mldsa-${{ matrix.runner }}-candidate
          path: ${{ steps.asset.outputs.path }}
          if-no-files-found: error
          retention-days: 7
